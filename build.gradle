plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group_id
// jar 版本带 loader+MC 后缀：ae2vm-<ver>_neoforge_1.21.1.jar / ae2vm-nodetect-<ver>_neoforge_1.21.1.jar
// （与 Forge 1.20.1 兄弟项目 ae2vm-<ver>_forge_1.20.1.jar 命名风格一致）
version = "${mod_version}_neoforge_${minecraft_version}"

// blockedMode: 'crash'(默认) → 检测到该作者 mod 游戏闪退；'warn' → 只警告不闪退
// 每次编译出两个版本：ae2vm-<ver>.jar（crash / 针对检测）+ ae2vm-nodetect-<ver>.jar（warn / 无针对检测）
def blockedMode = providers.gradleProperty('blockedMode').getOrElse('crash')
def modArchiveName = blockedMode == 'warn' ? 'ae2vm-nodetect' : mod_id

base {
    archivesName = modArchiveName
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    mods {
        ae2vm {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        server {
            server()
        }
        // Independent verification instance: own game directory and world (run-selftest/),
        // never the installed pack. Active only with -Dae2vm.selftest; see SelftestHarness.
        selftestServer {
            server()
            gameDirectory = project.file('run-selftest')
            jvmArguments.add('-Dae2vm.selftest=1')
            jvmArguments.add('-Dae2vm.selftest.exit=true')
            jvmArguments.add("-Dae2vm.selftest.task=${providers.gradleProperty('selftestTask').getOrElse('growth')}")
        }
    }
}

dependencies {
    compileOnly files('../../../mods/ae2jeiintegration-1.2.1.jar')
    // Optional AdvancedAE quantum CPU bridge; compile-only, supplied by the installed instance.
    def advancedaeJar = providers.gradleProperty('advancedaeJar').getOrElse('../../../mods/AdvancedAE-1.6.12-1.21.1.jar')
    compileOnly files(advancedaeJar)
    testRuntimeOnly files(advancedaeJar)
    // Independent verification instance: AdvancedAE and AE2's guideme dependency must be
    // loadable at runtime for the dedicated-server selftest.
    runtimeOnly files(advancedaeJar)
    runtimeOnly files(providers.gradleProperty('guidemeJar').getOrElse('../../../mods/guideme-21.1.19.jar'))
    runtimeOnly files(providers.gradleProperty('geckolibJar').getOrElse('../../../mods/geckolib-neoforge-1.21.1-4.9.3.jar'))
    // Optional client integrations; supplied by the installed ATM10 instance.
    compileOnly files(providers.gradleProperty('jeiJar').getOrElse('../../../mods/jei-1.21.1-neoforge-19.57.0.446.jar'))
    compileOnly files(providers.gradleProperty('ae2ctJar').getOrElse('../../../mods/ae2ct-1.21.1-1.1.1.jar'))
    testRuntimeOnly files(providers.gradleProperty('jeiJar').getOrElse('../../../mods/jei-1.21.1-neoforge-19.57.0.446.jar'))
    testRuntimeOnly files(providers.gradleProperty('ae2ctJar').getOrElse('../../../mods/ae2ct-1.21.1-1.1.1.jar'))
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "io.github.llamalad7:mixinextras-neoforge:0.5.3"
    // Thunderbolt-Core（弱依赖 / 可选前置，compileOnly）：未安装也能正常运行。
    // 装了且通过 /thunderbolt engine ae2vm 选中本引擎时，才把 AE2 合成计算路由到 VM；
    // 未选中则不走 VM（交给 Thunderbolt/原版）。neoforge.mods.toml 不声明硬依赖。
    // Thunderbolt-Core 弱依赖 (compileOnly, optional)：API 接口来自 jar (com.moakiee.thunderbolt.api.crafting.*)。
    // 下面 37 个 source 文件位于 src/main/java/com/moakiee/thunderbolt/core/crafting/ —— 是 AE2VMAddon 的
    // "VM 测试套件" reference framework（VM 自身测试如 Ae2VmReferenceCapabilitySuiteTest 引用这些类），
    // 编译时 Gradle source class 优先于 jar（同名时 main 编译产物覆盖 jar 中的 class），
    // 故不需要 exclude —— 2.0-alpha jar 提供接口，main source 提供 core.crafting.* 实现。
    // (v1.13.16+) Thunderbolt-Core algorithm library was stubbed out.
    // Re-enable: git restore ThunderboltCompat + AE2VMBatchCraftingPlanner from v1.13.15,
    // uncomment registerIfPresent() in AE2VMAddon.java, then uncomment:
    compileOnly files('E:/TB ThirdParty/Thunderbolt-Core/build/libs/thunderbolt-2.0-alpha.jar')

    testImplementation 'org.spongepowered:mixin:0.8.5'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

// Moddev 只把 moddev 生成的游戏类 + neoforge 依赖树注入 main 的编译/运行路径，
// 不注入 test。单元测试里的 VM 桥接基准（src/test/.../bench/）要离线驱动
// CraftingVM，需要 net.minecraft.* / com.mojang.*（DFU/brigadier 等），
// 因此把 main 的完整类路径接给 test。
afterEvaluate {
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.named('compileTestJava') { dependsOn 'createMinecraftArtifacts' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // 打印 [reference-capability] 结果行到控制台（AE2VM 参考能力速度基准）
    testLogging {
        showStandardStreams = true
    }
}

// Correctness regression suite, explicitly separate from the upstream sub-microsecond timing assertions.
// The ordinary `test` task above is unchanged and still includes all benchmarks.
tasks.register('routeFunctionalTest', Test) {
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    jvmArgs '-Xverify:all'
    exclude '**/PerformanceBenchmark.class'
}

// 构建戳：同名版本号的两次构建必须能区分开（曾因此让玩家一直跑旧包）。
def buildStampDir = layout.buildDirectory.dir('generated/buildstamp')
sourceSets.main.resources.srcDir(buildStampDir)

tasks.register('generateBuildStamp') {
    def out = buildStampDir
    def ver = project.version.toString()
    def stamp = new Date().format('yyyy-MM-dd HH:mm:ss')
    outputs.dir(out)
    inputs.property('version', ver)
    inputs.property('stamp', stamp)
    doLast {
        def f = out.get().file('ae2vm-build.properties').asFile
        f.parentFile.mkdirs()
        f.text = "# generated by generateBuildStamp\nversion=${ver}\nbuilt=${stamp}\n"
    }
}

tasks.named('processResources', ProcessResources) {
    dependsOn 'generateBuildStamp'
    filteringCharset = 'UTF-8' // prevent non-ASCII corruption on Windows (GBK default)
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            minecraft_version      : minecraft_version,
            neoforge_version_range : neoforge_version_range,
            ae2_version_range      : ae2_version_range
    ]
    inputs.properties replaceProperties
    inputs.property('blockedMode', blockedMode)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }

    // 把 blockedMode(crash/warn) 展开进 ae2vm/blockedmode.txt，打包进 jar，运行时可读
    filesMatching('ae2vm/blockedmode.txt') {
        expand([blockedMode: blockedMode])
    }
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += [
        '-Amixin.refmap=ae2vm.refmap.json'
    ]
}

// The selftest harness exists only for the independent verification instance; it is
// compiled into the dev classpath (so the server run can load it) but never shipped.
tasks.named('jar', Jar) {
    exclude 'com/ae2vm/addon/selftest/**'
}

// Auto-copy compiled JAR to Minecraft mods folder after build
// Remove all old versions of this mod before copying the new one
// 只删当前变体的旧 jar，保留另一个变体（crash 变体不会误删 nodetect 变体）
// 属性在 doLast 外捕获成局部变量（doLast 里拿不到配置期的 mod_version/modArchiveName 值）
tasks.register('cleanOldJars') {
    def modsDir = java.nio.file.Path.of('E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods')
    // crash 变体(ae2vm) → ae2vm-<数字>.jar；warn 变体(ae2vm-nodetect) → ae2vm-nodetect-*.jar
    def glob = modArchiveName == 'ae2vm' ? 'ae2vm-[0-9]*.jar' : "${modArchiveName}-*.jar"
    doLast {
        java.nio.file.Files.newDirectoryStream(modsDir, glob).withCloseable { stream ->
            stream.each { java.nio.file.Files.deleteIfExists(it) }
        }
    }
}

tasks.register('copyJarToMods', Copy) {
    dependsOn tasks.named('jar')
    dependsOn 'cleanOldJars'
    from tasks.named('jar').flatMap { it.archiveFile }
    into 'E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods'
    doLast {
        logger.lifecycle("Copied JAR to mods folder")
    }
}

// Hook into the build lifecycle: build → copyJarToMods
tasks.named('build') {
    finalizedBy 'copyJarToMods'
}
