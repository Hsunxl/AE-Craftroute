plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group_id
// jar name carries the loader and Minecraft version: aecraftroute-<ver>_neoforge_1.21.1.jar
version = "${mod_version}_neoforge_${minecraft_version}"

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    mods {
        aecraftroute {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        qaClient {
            client()
            gameDirectory = project.file('run-qa')
            jvmArguments.add('-Daecraftroute.qa=true')
            programArguments.addAll('--quickPlaySingleplayer', 'AE-Craftroute-QA', '--width', '1280', '--height', '800')
        }
        server {
            server()
        }
        // Independent verification instance: own game directory and world (run-selftest/),
        // never the installed pack. Active only with -Daecraftroute.selftest; see SelftestHarness.
        selftestServer {
            server()
            gameDirectory = project.file('run-selftest')
            jvmArguments.add('-Daecraftroute.selftest=1')
            jvmArguments.add('-Daecraftroute.selftest.exit=true')
            // Plain String, not a GString: ModDevGradle casts jvmArguments entries to String.
            jvmArguments.add('-Daecraftroute.selftest.task=' + providers.gradleProperty('selftestTask').getOrElse('growth'))
        }
    }
}

dependencies {
    if (providers.gradleProperty('uiQa').isPresent()) {
        runtimeOnly files('../../../mods/jei-1.21.1-neoforge-19.57.0.446.jar')
    }
    compileOnly files('../../../mods/ae2jeiintegration-1.2.1.jar')
    // Optional AdvancedAE quantum CPU bridge; compile-only, supplied by the installed instance.
    def advancedaeJar = providers.gradleProperty('advancedaeJar').getOrElse('../../../mods/AdvancedAE-1.6.12-1.21.1.jar')
    compileOnly files(advancedaeJar)
    testRuntimeOnly files(advancedaeJar)
    // Independent verification instance: AdvancedAE and AE2's guideme dependency must be
    // loadable at runtime for the dedicated-server selftest.
    runtimeOnly files(advancedaeJar)
    runtimeOnly files(providers.gradleProperty('guidemeJar').getOrElse('../../../mods/guideme-21.1.19.jar'))
    runtimeOnly files(providers.gradleProperty('geckolibJar').getOrElse('../../../mods/geckolib-neoforge-1.21.1-4.9.3.jar'))
    // Optional client integrations; supplied by the installed ATM10 instance.
    compileOnly files(providers.gradleProperty('jeiJar').getOrElse('../../../mods/jei-1.21.1-neoforge-19.57.0.446.jar'))
    compileOnly files(providers.gradleProperty('ae2ctJar').getOrElse('../../../mods/ae2ct-1.21.1-1.1.1.jar'))
    testRuntimeOnly files(providers.gradleProperty('jeiJar').getOrElse('../../../mods/jei-1.21.1-neoforge-19.57.0.446.jar'))
    testRuntimeOnly files(providers.gradleProperty('ae2ctJar').getOrElse('../../../mods/ae2ct-1.21.1-1.1.1.jar'))
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "io.github.llamalad7:mixinextras-neoforge:0.5.3"
    // Thunderbolt-Core was an optional compile-only dependency up to v1.13.15. Since v1.13.16
    // its algorithm library is stubbed out (com.aecraftroute.addon.compat.thunderbolt), nothing in the
    // sources references it, and no artifact is needed to build. Re-enabling it means restoring
    // the v1.13.15 sources and the dependency together, so nothing is declared here.

    testImplementation 'org.spongepowered:mixin:0.8.5'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

// Moddev 只把 moddev 生成的游戏类 + neoforge 依赖树注入 main 的编译/运行路径，
// 不注入 test。单元测试里的 VM 桥接基准（src/test/.../bench/）要离线驱动
// CraftingVM，需要 net.minecraft.* / com.mojang.*（DFU/brigadier 等），
// 因此把 main 的完整类路径接给 test。
afterEvaluate {
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.named('compileTestJava') { dependsOn 'createMinecraftArtifacts' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'benchmark' }
    // 打印 [reference-capability] 结果行到控制台（AE-Craftroute 参考能力速度基准）
    testLogging {
        showStandardStreams = true
    }
}

// Correctness regressions are separate from opt-in performance measurements.
tasks.register('routeFunctionalTest', Test) {
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { excludeTags 'benchmark' }
    jvmArgs '-Xverify:all'
    exclude '**/PerformanceBenchmark.class'
}

tasks.register('productionBenchmark', Test) {
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'benchmark' }
    maxParallelForks = 1
    minHeapSize = '512m'
    maxHeapSize = '2g'
    systemProperty 'aecraftroute.benchmark.warmups', providers.gradleProperty('benchmarkWarmups').getOrElse('10')
    systemProperty 'aecraftroute.benchmark.samples', providers.gradleProperty('benchmarkSamples').getOrElse('30')
    testLogging { showStandardStreams = true }
    outputs.upToDateWhen { false }
}

// 构建戳：同名版本号的两次构建必须能区分开（曾因此让玩家一直跑旧包）。
def buildStampDir = layout.buildDirectory.dir('generated/buildstamp')
sourceSets.main.resources.srcDir(buildStampDir)

tasks.register('generateBuildStamp') {
    def out = buildStampDir
    def ver = project.version.toString()
    def stamp = new Date().format('yyyy-MM-dd HH:mm:ss')
    outputs.dir(out)
    inputs.property('version', ver)
    inputs.property('stamp', stamp)
    doLast {
        def f = out.get().file('aecraftroute-build.properties').asFile
        f.parentFile.mkdirs()
        f.text = "# generated by generateBuildStamp\nversion=${ver}\nbuilt=${stamp}\n"
    }
}

tasks.named('processResources', ProcessResources) {
    dependsOn 'generateBuildStamp'
    filteringCharset = 'UTF-8' // prevent non-ASCII corruption on Windows (GBK default)
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            minecraft_version      : minecraft_version,
            neoforge_version_range : neoforge_version_range,
            ae2_version_range      : ae2_version_range
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += [
        '-Amixin.refmap=aecraftroute.refmap.json'
    ]
}

// The build stamp is generated output, not a source file: the sources artifact must not
// carry it, and it must not read the directory without depending on the task that writes it.
tasks.named('sourcesJar', Jar) {
    dependsOn 'generateBuildStamp'
    exclude 'aecraftroute-build.properties'
}

// The selftest harness and the QA fixtures exist only for the independent
// verification instances; both are compiled into the dev classpath (so the server
// and client runs can load them) but neither is shipped in the release jar.
tasks.named('jar', Jar) {
    exclude 'com/aecraftroute/addon/selftest/**'
    exclude 'com/aecraftroute/addon/route/RouteQaFixtures*'
}

// Building never deploys into a Minecraft instance. Deploy explicitly after verification.

