modLoader="javafml"
loaderVersion="[1,)"
license="LGPL-3.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="aecraftroute.png"
authors="Tao"
description='''
Certified net-production planning for AE2: cyclic recipes and feedback reuse with
an executable ordered schedule, native and AdvancedAE CPU bridges, durable job
persistence, exact plan caching, and a server-validated crafting canvas.
Resource limits are reported as undecided rather than fabricated missing items.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Optional client recipe import uses the per-recipe button API present in the tested JEI build.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.57.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"

# Thunderbolt-Core（可选，第三方兼容）：装了闪电库时要求版本 >= 2.0.0-beta.1
# （对应 ae2lt/Thunderbolt-Core 分支 main，对齐 1.21.1 NeoForge 的 API：
#  com.moakiee.thunderbolt.api.crafting.{CraftingPlanningEngine,PlanningRequest,
#  PlanningEngineSession,PlanningAttempt,PlanningAttemptContext,PlanningExitException,
#  CraftingPlanningEngines,CraftingPlanningEngineDescriptor,PlanningChoice}）。
# 引擎 ID "aecraftroute" 通过 CraftingPlanningEngines.register 注册为可选私有算法。
[[dependencies.${mod_id}]]
    modId="thunderbolt"
    type="optional"
    versionRange="[2.0.0-beta.1,)"
    ordering="NONE"
    side="BOTH"

# Configured（可选）：装了可在游戏内 Mod Configuration 界面编辑 config/aecraftroute-common.toml；不装配置仍然生效
[[dependencies.${mod_id}]]
    modId="configured"
    type="optional"
    versionRange="[2,3)"
    ordering="NONE"
    side="BOTH"

